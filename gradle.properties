org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=Cp1251
# ^ ВАЖНО: @argfile test-worker'а JDK читает в ANSI (CP_ACP=1251 на этой
# машине), а не в UTF-8; UTF-8 в jvmargs ломает запуск воркера с
# кириллицей в путях (проверено: java @argfile + UTF-8 -> ClassNotFoundException).
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
# Путь проекта содержит кириллицу (C:\Users\Оксана\...) — штатный обход
# проверки AGP (b.android.com/95744); корректность сборки проверяется
# на практике прогонами :core:test и :app:assembleDebug.
android.overridePathCheck=true
